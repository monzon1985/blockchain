[workspace]
resolver = "3"
members = ["crates/risk-math", "crates/keeper", "crates/cascade-sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
repository = "https://github.com/monzon1985/blockchain"

[workspace.dependencies]
risk-math = { path = "crates/risk-math" }
alloy = { version = "2.5.0", default-features = false, features = [
    "std",
    "reqwest",
    "reqwest-rustls-tls",
    "essentials",
    "node-bindings",
    "signer-keystore",
] }
alloy-primitives = { version = "1.6", default-features = false, features = ["std", "serde"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
libm = "0.2.16"
proptest = "1.11"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
debug = false
