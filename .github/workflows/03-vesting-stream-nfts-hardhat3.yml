name: "3 · Vesting Stream NFTs (Hardhat 3)"

on:
  push:
    branches: [main]
    paths:
      - "projects/03-vesting-stream-nfts-hardhat3/**"
      - ".github/workflows/03-vesting-stream-nfts-hardhat3.yml"
  pull_request:
    paths:
      - "projects/03-vesting-stream-nfts-hardhat3/**"
      - ".github/workflows/03-vesting-stream-nfts-hardhat3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main always finish, so the README badge never shows "cancelled".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: projects/03-vesting-stream-nfts-hardhat3
    # Explicit `shell: bash` runs with `-eo pipefail`, so a failing command piped into `tee` fails the step.
    shell: bash

env:
  NODE_VERSION: "24"
  FOUNDRY_VERSION: v1.8.3
  UV_VERSION: "0.12.20"
  SLITHER_VERSION: "0.11.6"
  CRYTIC_COMPILE_VERSION: "0.4.2"
  SOLC_SELECT_VERSION: "1.2.0"
  SOLC_VERSION: "0.8.37"
  LOCKFILE: projects/03-vesting-stream-nfts-hardhat3/package-lock.json

jobs:
  hardhat:
    name: Build, lint, tests, invariants, coverage, gas, demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.LOCKFILE }}

      # Hardhat downloads solc into this directory; the compiler version is pinned in hardhat.config.ts.
      - name: Cache solc downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-solc-${{ runner.os }}-${{ hashFiles('projects/03-vesting-stream-nfts-hardhat3/hardhat.config.ts') }}

      # Only used for `forge fmt --check` on the Solidity sources; the project itself is built and tested by Hardhat 3.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install (locked)
        run: npm ci

      - name: Toolchain versions
        run: |
          node --version
          npx hardhat --version
          forge --version

      - name: Build (solc 0.8.37, EVM osaka)
        run: npx hardhat build

      - name: Typecheck (strict)
        run: npx tsc --noEmit

      - name: Lint (ESLint, typescript-eslint strict type-checked)
        run: npm run lint

      - name: Format (Prettier for TypeScript, forge fmt for Solidity)
        run: |
          npm run format:check
          npm run fmt:sol:check

      # One run of the default profile both executes every Solidity test and checks .gas-snapshot.
      - name: Solidity unit, fuzz and invariant suites (default profile) + gas snapshot check (.gas-snapshot)
        run: npx hardhat test solidity --snapshot-check

      - name: node:test integration suites (golden files, escaping, gas budget, differential, lifecycle, Ignition)
        run: npx hardhat test nodejs

      - name: Deeper campaign (ci profile, fixed seed, 5,000 fuzz runs, 256 x 128 invariant calls)
        run: npx hardhat test solidity --test-profile ci

      - name: Coverage of production contracts (gate 100 % lines, the same `npm run coverage:check` as the README)
        run: |
          npx hardhat test --coverage
          npm run --silent coverage:check | tee "$RUNNER_TEMP/coverage.txt"
          { echo "### Line coverage"; echo '```'; cat "$RUNNER_TEMP/coverage.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Gas table (gas-table.json must be reproduced exactly)
        run: |
          npm run gas:check | tee "$RUNNER_TEMP/gas.txt"
          { echo "### Gas"; grep -E '^\|' "$RUNNER_TEMP/gas.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Ignition demo (deploy, batch-create, time travel, cancel, render)
        run: npm run demo

      # Also catches new untracked files (a stray fixture, a leftover output): anything generated must be git-ignored.
      - name: No committed file was rewritten and no unexpected file was created
        run: git status --porcelain --untracked-files=all -- . | tee /dev/stderr | (! grep .)

  slither:
    name: Slither (zero findings, pedantic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.LOCKFILE }}

      - name: Install (locked; Slither resolves imports from node_modules)
        run: npm ci

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Slither and solc
        run: |
          uv tool install "slither-analyzer==${SLITHER_VERSION}" --with "crytic-compile==${CRYTIC_COMPILE_VERSION}"
          uv tool install "solc-select==${SOLC_SELECT_VERSION}"
          bin_dir="$(uv tool dir --bin)"
          echo "$bin_dir" >> "$GITHUB_PATH"
          export PATH="$bin_dir:$PATH"
          solc-select install "${SOLC_VERSION}"
          solc-select use "${SOLC_VERSION}"
          solc --version
          slither --version

      - name: Analyze (any finding fails; exclusions and inline suppressions are triaged in docs/static-analysis.md)
        run: npm run slither

  mutation:
    name: Mutation spot-check (every injected bug must fail the suite)
    runs-on: ubuntu-latest
    # The 21-mutant campaign took under 7 minutes on ubuntu-latest (run 36891915571); 30 minutes leaves room for the
    # current 24. Every Hardhat invocation inside it is also bounded by scripts/mutation.ts (10 minutes each), so a
    # hanging mutant cannot eat the whole budget, and the job runs on main and on pull requests only.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.LOCKFILE }}

      - name: Cache solc downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-solc-${{ runner.os }}-${{ hashFiles('projects/03-vesting-stream-nfts-hardhat3/hardhat.config.ts') }}

      - name: Install (locked)
        run: npm ci

      - name: Inject 24 bugs one at a time (scripts/mutation.ts)
        run: npm run mutation

      - name: Sources restored after the campaign, nothing left behind
        run: git status --porcelain --untracked-files=all -- . | tee /dev/stderr | (! grep .)
