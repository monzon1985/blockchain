[workspace]
resolver = "3"
members = [
    "crates/keysmith-core",
    "crates/keysmith-cli",
    "crates/keysmith-relay",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/monzon1985/blockchain"
publish = false

[workspace.dependencies]
# Internal crates
keysmith-core = { path = "crates/keysmith-core", default-features = false }
keysmith-relay = { path = "crates/keysmith-relay" }

# Cryptography. RustCrypto "digest 0.10" generation, the same one alloy 2.5 and Foundry 1.8 ship.
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = { version = "0.10.8", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
hmac = { version = "0.12.1", default-features = false }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
scrypt = { version = "0.11.0", default-features = false }
aes = { version = "0.8.4", default-features = false }
ctr = { version = "0.9.2", default-features = false }
ripemd = { version = "0.1.3", default-features = false }
subtle = { version = "2.6", default-features = false }
unicode-normalization = { version = "0.1.25", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

# Serialization / errors (no_std + alloc capable)
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }

# CLI / OS
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.3.4"
rpassword = "7.4"

# Online half only (keysmith-relay). Never a dependency of the signer path.
ureq = { version = "3.1", default-features = false, features = ["json", "rustls"] }

# Differential oracles (dev-dependencies only)
alloy = { version = "2.5.0", default-features = false, features = [
    "std",
    "consensus",
    "eips",
    "rlp",
    "k256",
    "serde",
    "signer-local",
    "signer-mnemonic",
    "signer-keystore",
    "eip712",
    "dyn-abi",
    "sol-types",
] }

# Testing
proptest = "1.11"
insta = { version = "1.48", features = ["json"] }
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
# Only to drive eth-keystore (via alloy) in the keystore differential test.
rand = "0.8.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.test]
opt-level = 1

# scrypt and proptest are painfully slow unoptimised.
[profile.test.package."*"]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
