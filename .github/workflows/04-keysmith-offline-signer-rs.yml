name: "4 · Keysmith Air-Gapped Signer"

on:
  push:
    paths:
      - "projects/04-keysmith-offline-signer-rs/**"
      - ".github/workflows/04-keysmith-offline-signer-rs.yml"
  pull_request:
    paths:
      - "projects/04-keysmith-offline-signer-rs/**"
      - ".github/workflows/04-keysmith-offline-signer-rs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/04-keysmith-offline-signer-rs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Deterministic property tests in CI (fixed seed; proptest reads it through its default config).
  PROPTEST_RNG_SEED: "4"
  # insta must compare against committed snapshots, never write new ones.
  INSTA_UPDATE: "no"

jobs:
  rust:
    name: Rust · fmt, clippy, tests, air-gap, no_std
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/04-keysmith-offline-signer-rs

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo clippy (anvil-e2e feature)
        run: cargo clippy --locked -p keysmith-cli --features anvil-e2e --all-targets -- -D warnings

      - name: cargo test (unit, official vectors, cast golden, alloy differential, properties, CLI, relay)
        run: cargo test --locked --workspace

      - name: Air-gap check (signer dependency graph + source scan + positive control)
        run: cargo xtask check-airgap

      - name: no_std build of keysmith-core (bare-metal target, no std available)
        run: cargo build --locked -p keysmith-core --no-default-features --target thumbv7em-none-eabihf

      - name: Deeper differential and property campaign (5,000 cases per property, fixed seed)
        env:
          PROPTEST_CASES: "5000"
        run: cargo test --locked -p keysmith-core --test differential_alloy --test properties

  foundry:
    name: Foundry · cast golden-vector drift, anvil end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/04-keysmith-offline-signer-rs
          key: foundry

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Golden vectors are current (cast must be 1.8.3; re-run it and compare with the committed file)
        run: cargo xtask regen-golden --check

      - name: anvil --hardfork osaka end-to-end (every tx type, EIP-7702, ecrecover, cast keystores)
        run: cargo test --locked -p keysmith-cli --features anvil-e2e -- --test-threads=1

      - name: README demo (keysmith-relay and keysmith binaries against anvil --port 0)
        run: bash scripts/demo.sh

  supply-chain:
    name: Supply chain · cargo-deny (advisories, bans, sources, licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny (RustSec advisories, duplicate/wildcard bans, crates.io only, permissive licences)
        run: cargo deny --locked check advisories bans sources licenses

  coverage:
    name: Coverage · cargo-llvm-cov (gate 90 % lines)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/04-keysmith-offline-signer-rs
          key: coverage

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Instrumented test run
        run: cargo llvm-cov --locked --workspace --no-report

      - name: llvm-cov summary (all instrumented lines, inline unit-test modules included)
        run: cargo llvm-cov report --summary-only --ignore-filename-regex '(xtask|[\\/]tests[\\/])'

      - name: "Production line coverage (tests/, xtask and inline #[cfg(test)] modules excluded), gate 90 %"
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex '(xtask|[\\/]tests[\\/])'
          cargo xtask coverage lcov.info --fail-under 90
