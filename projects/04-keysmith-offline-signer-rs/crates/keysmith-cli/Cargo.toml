[package]
name = "keysmith-cli"
description = "keysmith: the offline half of the air-gapped signer (derive, sign, decode). Contains no networking code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "keysmith"
path = "src/main.rs"

[features]
# Spawns `anvil --hardfork osaka` and broadcasts every transaction type. Needs Foundry on PATH.
anvil-e2e = []

[dependencies]
keysmith-core = { workspace = true, features = ["std"] }
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["std"] }
getrandom.workspace = true
rpassword.workspace = true
zeroize.workspace = true
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
keysmith-relay.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
insta.workspace = true

[lints]
workspace = true
