[project]
name = "v4-volatility-fee-sim"
version = "0.1.0"
description = "Reference vectors (mpmath) and seeded GBM price paths for the Uniswap v4 volatility-fee hook"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mpmath==1.3.0",
    "numpy==2.3.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
