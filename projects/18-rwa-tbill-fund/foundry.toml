[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./demo-out" }]

[profile.default.fuzz]
runs = 256
max_test_rejects = 131072

[profile.default.invariant]
runs = 64
depth = 128
fail_on_revert = false
show_metrics = true

# CI: fixed seed (shared by fuzz and invariant campaigns) so runs are reproducible.
[profile.ci.fuzz]
runs = 1024
seed = "0x18"
max_test_rejects = 131072

[profile.ci.invariant]
runs = 64
depth = 128
fail_on_revert = false
show_metrics = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
# Every excluded rule and every inline `forge-lint: disable-next-line` is justified in docs/STATIC_ANALYSIS.md.
# Tests, mocks and scripts are not linted.
ignore = ["test/**/*.sol", "script/**/*.sol"]
exclude_lints = [
    "reentrancy-events",
    "block-timestamp",
    "calls-loop",
    "require-revert-in-loop",
    "missing-events-access-control",
]

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
forge-std = "1.16.2"
