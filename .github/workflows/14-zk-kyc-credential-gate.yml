name: "14 · ZK KYC Credential Gate"

on:
  push:
    paths:
      - "projects/14-zk-kyc-credential-gate/**"
      - ".github/workflows/14-zk-kyc-credential-gate.yml"
  pull_request:
    paths:
      - "projects/14-zk-kyc-credential-gate/**"
      - ".github/workflows/14-zk-kyc-credential-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zk-kyc-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/14-zk-kyc-credential-gate

jobs:
  build-and-test:
    name: build, prove, verify
    runs-on: ubuntu-latest
    # A cold run regenerates the deterministic 2^16 ceremony (~15-25 min);
    # warm runs restore it (and the zkeys) from the cache below.
    timeout-minutes: 90
    env:
      CIRCOM_VERSION: "2.2.3"
      # sha256 of circom-linux-amd64 v2.2.3, as published in the GitHub release asset digest.
      CIRCOM_SHA256: "85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3"
      # Latest circomspect on crates.io (there is no 0.11.x; that is the Slither version).
      CIRCOMSPECT_VERSION: "0.9.0"
      RUST_VERSION: "1.98.1"
      UV_VERSION: "0.12.0"
      SLITHER_VERSION: "0.11.6"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/14-zk-kyc-credential-gate/package-lock.json

      - name: Install Foundry 1.8.3
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.8.3"

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install circom ${{ env.CIRCOM_VERSION }} (sha256-pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/circom" \
            "https://github.com/iden3/circom/releases/download/v${CIRCOM_VERSION}/circom-linux-amd64"
          echo "${CIRCOM_SHA256}  $RUNNER_TEMP/circom" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$RUNNER_TEMP/circom" "$HOME/.local/bin/circom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/circom" --version

      - name: Cache circomspect binary
        id: circomspect-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/circomspect
          key: circomspect-${{ env.CIRCOMSPECT_VERSION }}-rust-${{ env.RUST_VERSION }}-${{ runner.os }}

      - name: Set up Rust ${{ env.RUST_VERSION }} (only to build circomspect)
        if: steps.circomspect-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install circomspect ${{ env.CIRCOMSPECT_VERSION }}
        run: |
          if [ ! -x "$HOME/.cargo/bin/circomspect" ]; then
            cargo install circomspect --version "${CIRCOMSPECT_VERSION}" --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/circomspect" --help | head -1

      - name: Install slither ${{ env.SLITHER_VERSION }}
        run: uv tool install "slither-analyzer==${SLITHER_VERSION}"

      - name: npm ci
        run: npm ci

      - name: npm audit (production dependencies, triaged in README "Dependency advisories")
        run: npm audit --omit=dev --audit-level=critical

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build circuits
        run: npm run circuits:build

      # The ceremony is deterministic, so caching it is safe: the next step
      # recomputes every hash and fails unless the (cached or fresh) ptau,
      # zkeys, vkeys and verifiers match the committed PROVENANCE.json and
      # contracts/generated/*.sol byte for byte. Any change to a circuit, the
      # setup scripts or the lockfile changes the key and forces a cold run.
      - name: Cache deterministic trusted setup
        uses: actions/cache@v4
        with:
          path: |
            projects/14-zk-kyc-credential-gate/build/ptau
            projects/14-zk-kyc-credential-gate/build/keys
          key: zkkyc-setup-${{ runner.os }}-${{ hashFiles('projects/14-zk-kyc-credential-gate/circuits/**', 'projects/14-zk-kyc-credential-gate/scripts/setup-dev.mjs', 'projects/14-zk-kyc-credential-gate/scripts/config.mjs', 'projects/14-zk-kyc-credential-gate/package-lock.json') }}

      - name: Trusted setup + reproducibility check (byte-for-byte vs committed verifiers)
        run: npm run setup:dev -- --check

      - name: Circuit, library and prover tests (circom_tester + mocha)
        run: npm test

      - name: Bug zoo - end-to-end forgeries + wtns-check differential
        run: npm run zoo

      - name: circomspect (production circuits, fail-closed)
        run: npm run lint:circuits

      - name: Verify committed proof fixtures against the regenerated keys
        run: npm run fixtures -- --check

      - name: Soldeer install
        working-directory: projects/14-zk-kyc-credential-gate/contracts
        run: forge soldeer install

      - name: forge fmt --check
        working-directory: projects/14-zk-kyc-credential-gate/contracts
        run: forge fmt --check

      - name: forge build
        working-directory: projects/14-zk-kyc-credential-gate/contracts
        run: forge build

      # FORGE_SNAPSHOT_CHECK makes the named vm.snapshotGasLastFrame values in
      # snapshots/GasBench.json a gate (without it, forge test would rewrite them).
      - name: forge test (+ named gas snapshot check)
        working-directory: projects/14-zk-kyc-credential-gate/contracts
        env:
          FOUNDRY_PROFILE: ci
          FORGE_SNAPSHOT_CHECK: "true"
        run: forge test -vvv

      - name: Whole-test gas snapshot check
        working-directory: projects/14-zk-kyc-credential-gate/contracts
        run: forge snapshot --check --match-contract GasBench

      - name: forge lint
        working-directory: projects/14-zk-kyc-credential-gate/contracts
        run: forge lint src/

      - name: Slither static analysis
        working-directory: projects/14-zk-kyc-credential-gate/contracts
        run: slither . --fail-high

      - name: Local demo on anvil (deploy, prove, front-run rejected, register, replay rejected)
        run: npm run demo
