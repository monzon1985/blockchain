[workspace]
resolver = "3"
members = [
    "crates/vm",
    "crates/stf",
    "crates/l1",
    "crates/diff",
    "crates/node",
    "crates/economics",
    "crates/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
repository = "https://github.com/monzon1985/blockchain"

[workspace.dependencies]
rollup-vm = { path = "crates/vm" }
rollup-stf = { path = "crates/stf" }
rollup-l1 = { path = "crates/l1" }
rollup-diff = { path = "crates/diff" }
rollup-node = { path = "crates/node" }
rollup-economics = { path = "crates/economics" }

alloy = { version = "2.5.0", default-features = false, features = [
    "std",
    "contract",
    "json-abi",
    "network",
    "node-bindings",
    "provider-http",
    "provider-anvil-api",
    "reqwest",
    "rpc-types",
    "signer-keystore",
    "signer-local",
    "sol-types",
] }
alloy-primitives = { version = "1.7.3", features = ["k256", "serde"] }
alloy-sol-types = "1.7.3"
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
k256 = { version = "0.13.4", features = ["ecdsa"] }
proptest = "1.11.0"
rand = "0.8.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
revm = { version = "43.0.3", default-features = false, features = ["std", "secp256k1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
