[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 10000
# The Go bindings in ../internal/bindings embed this bytecode, and CI regenerates them with
# `go generate ./...` followed by `git diff --exit-code -- internal/bindings`. CBOR metadata
# (source hashes, compiler build info) would make the bytes machine-dependent, so it is off.
bytecode_hash = "none"
cbor_metadata = false

[profile.default.fuzz]
runs = 1024

[profile.ci.fuzz]
runs = 4096
seed = "0x11"

[fmt]
line_length = 100

[soldeer]
remappings_generate = true
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
forge-std = "1.16.2"
