[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"

[soldeer]
remappings_generate = true
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.7.0"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = true

# Deterministic CI profile: fixed seed, more runs.
[profile.ci.fuzz]
runs = 1000
seed = "0x2525"

[profile.ci.invariant]
runs = 128
depth = 128
fail_on_revert = true
