[package]
name = "rfq-client"
description = "Off-chain client for the RFQ settlement programs: PDAs, instruction builders, quote signing, transfer-hook account resolution and v0 transactions with address lookup tables."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rfq-core.workspace = true
solana-address = { workspace = true, features = ["curve25519", "decode"] }
solana-instruction.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-signature.workspace = true
solana-message = { workspace = true, features = ["wincode"] }
solana-transaction = { workspace = true, features = ["wincode"] }
solana-hash.workspace = true
solana-address-lookup-table-interface = { workspace = true, features = ["bincode"] }
solana-compute-budget-interface.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
