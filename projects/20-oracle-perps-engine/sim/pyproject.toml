[project]
name = "perps-sim"
version = "0.1.0"
description = "Seeded GBM and Merton jump-diffusion price paths for the perpetuals engine replay tests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perps_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
