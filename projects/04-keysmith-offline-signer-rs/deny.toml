# SPDX-License-Identifier: MIT
# cargo-deny configuration: the supply-chain gate CI runs as
#   cargo deny --locked check advisories bans sources licenses
# The whole workspace graph is checked (signer, relay, xtask and dev-dependencies), with every
# feature enabled, so an advisory in an oracle crate or behind a feature is still reported.

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unsound, unmaintained) fails the check unless it is
# listed here with a written justification.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained (no known vulnerability). It is a compile-time proc-macro reached only through alloy-primitives, i.e. the alloy dev-dependency used as a differential-test oracle; `cargo tree -i paste` shows it in neither the signer's nor the relay's normal/build graph. The advisory lists no safe upgrade; revisit when alloy drops it." },
]
yanked = "deny"

[bans]
# alloy 2.5 (a dev-dependency used only as an oracle) and the RustCrypto stack pull in a few
# duplicate major versions; they are reported, not fatal.
multiple-versions = "warn"
# No `*` version requirements. The workspace's own crates are path dependencies without a
# version, which is fine because none of them is published (`publish = false`).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: no other registry and no git dependency can enter the lockfile.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# Permissive licences only (no copyleft). CDLA-Permissive-2.0 covers the Mozilla root
# certificates in webpki-roots, used by the online relay only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace crates are MIT (see Cargo.toml) and unpublished.
ignore = true
