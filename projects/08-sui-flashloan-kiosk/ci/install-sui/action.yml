# Composite action used by .github/workflows/08-sui-flashloan-kiosk.yml (every
# job that needs the Sui CLI). It downloads the official release tarball with
# retries, verifies its SHA-256 before anything is extracted or cached, installs
# the `sui` binary into ~/.sui-bin and puts it on PATH. The cache key contains
# the checksum, so a changed pin can never reuse a binary verified against an
# older one.
name: Install the Sui CLI
description: Download, verify (SHA-256) and cache a pinned Sui CLI release for ubuntu x86_64.

inputs:
  version:
    description: Sui release, e.g. 1.80.1 (tag mainnet-v<version>).
    required: true
  sha256:
    description: SHA-256 of sui-mainnet-v<version>-ubuntu-x86_64.tgz.
    required: true

runs:
  using: composite
  steps:
    - name: Cache the verified Sui CLI binary
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.sui-bin
        key: sui-cli-${{ inputs.version }}-${{ inputs.sha256 }}-${{ runner.os }}-x86_64

    - name: Download, verify and install sui ${{ inputs.version }}
      shell: bash
      env:
        SUI_VERSION: ${{ inputs.version }}
        SUI_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        if [ ! -x "$HOME/.sui-bin/sui" ]; then
          archive="$RUNNER_TEMP/sui.tgz"
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 5 -o "$archive" \
            "https://github.com/MystenLabs/sui/releases/download/mainnet-v${SUI_VERSION}/sui-mainnet-v${SUI_VERSION}-ubuntu-x86_64.tgz"
          echo "${SUI_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.sui-bin" "$RUNNER_TEMP/sui"
          tar -xzf "$archive" -C "$RUNNER_TEMP/sui" --wildcards '*sui'
          install -m 0755 "$(find "$RUNNER_TEMP/sui" -type f -name sui | head -n 1)" "$HOME/.sui-bin/sui"
          rm -rf "$RUNNER_TEMP/sui" "$archive"
        fi
        echo "$HOME/.sui-bin" >> "$GITHUB_PATH"
        "$HOME/.sui-bin/sui" --version
