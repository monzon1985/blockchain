name: "5 · Trie Inspector: RLP, MPT and state proofs (Go)"

on:
  push:
    branches: [main]
    paths:
      - "projects/05-mpt-state-proofs-go/**"
      - ".github/workflows/05-mpt-state-proofs-go.yml"
  pull_request:
    paths:
      - "projects/05-mpt-state-proofs-go/**"
      - ".github/workflows/05-mpt-state-proofs-go.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the running checks; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every gate is a stage of script/check.sh, the same script the README runs locally.
defaults:
  run:
    working-directory: projects/05-mpt-state-proofs-go
    shell: bash

env:
  FOUNDRY_VERSION: v1.8.3
  CGO_ENABLED: "0"
  # Logs and coverage profiles are kept so the numbers in the README can be traced to a run.
  EVIDENCE_RETENTION_DAYS: 30

jobs:
  fixture:
    name: Fixture contract (Foundry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: forge fmt --check, build, lint, test (ci profile, fixed fuzz seed)
        run: bash script/check.sh fixture

  gates:
    name: Go gates (hygiene, vet, unit + golden, integration on anvil, demo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: projects/05-mpt-state-proofs-go/go.mod
          cache-dependency-path: projects/05-mpt-state-proofs-go/go.sum

      - name: Hygiene (go mod tidy -diff, go mod verify, gofmt, go vet with both tags, ignore rules)
        run: bash script/check.sh hygiene

      - name: Unit, vector, differential, property and CLI golden tests
        run: bash script/check.sh unit

      - name: Integration tests (anvil, every hardfork from Berlin to Osaka)
        run: bash script/check.sh integration

      - name: Local demo (end-to-end smoke test of the README walkthrough)
        run: bash script/check.sh demo

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 05-gates-logs
          path: projects/05-mpt-state-proofs-go/*.log
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: warn

  coverage:
    name: Coverage (unit + integration merged, minimum 90 %)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: projects/05-mpt-state-proofs-go/go.mod
          cache-dependency-path: projects/05-mpt-state-proofs-go/go.sum

      - name: Merged statement coverage of the production packages
        run: COVERAGE_MIN=90 bash script/check.sh coverage

      - name: Keep the merged profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 05-coverage
          path: |
            projects/05-mpt-state-proofs-go/covdata/merged.out
            projects/05-mpt-state-proofs-go/coverage.log
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: warn

  race:
    name: Race detector (CI only; needs cgo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: projects/05-mpt-state-proofs-go/go.mod
          cache-dependency-path: projects/05-mpt-state-proofs-go/go.sum

      - name: Unit and integration tests under the race detector
        run: bash script/check.sh race

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 05-race-logs
          path: projects/05-mpt-state-proofs-go/*.log
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: warn

  fuzz:
    name: Fuzz (native Go fuzzing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: projects/05-mpt-state-proofs-go/go.mod
          cache-dependency-path: projects/05-mpt-state-proofs-go/go.sum

      - name: RLP round trip and trie order independence 60 s each (differential vs go-ethereum); proofs, hex-prefix, JSON-RPC 30 s each
        run: FUZZTIME_GATE=60s FUZZTIME_OTHER=30s bash script/check.sh fuzz

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 05-fuzz-logs
          path: projects/05-mpt-state-proofs-go/*.log
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Keep fuzz crashers of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 05-fuzz-crashers
          path: projects/05-mpt-state-proofs-go/**/testdata/fuzz/**
          if-no-files-found: ignore
