[workspace]
# Standalone workspace: mollusk-svm 0.15.1 links the Agave 4.2 runtime, while the
# rest of the repo (litesvm 0.17) links Agave 4.3. A single lockfile cannot hold
# both, so this crate keeps its own `Cargo.lock`.
members = ["."]

[package]
name = "cu-bench"
description = "Mollusk compute-unit benchmark and equivalence harness comparing the Anchor and Pinocchio settle implementations on shared instruction fixtures."
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
publish = false

[lib]
doctest = false

[dependencies]
rfq-core = { path = "../../crates/rfq-core" }

[dev-dependencies]
mollusk-svm = { version = "=0.15.1", features = ["precompiles"] }
mollusk-svm-programs-token = "=0.15.1"
solana-account = "4.3"
solana-pubkey = { version = "3", features = ["curve25519"] }
solana-instruction = "3"
solana-sdk-ids = "3.1"
solana-rent = "3"
ed25519-dalek = "2.2"
spl-token-interface = "2"
sha2 = "0.10"
# Captures program logs (the `Settled` event each program emits).
solana-svm-log-collector = "=4.2.2"
# Pin the Agave runtime crates mollusk builds against to a version that exists on
# crates.io as a full release (the 0.15.1 default resolves a 4.3 beta that fails
# to compile against the released solana-program-runtime).
solana-program-runtime = "=4.2.2"

[profile.dev]
# Mollusk + the Agave runtime are heavy; keep debug builds lean.
debug = 0

[lints]
