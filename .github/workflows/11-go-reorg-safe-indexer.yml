name: "11 · Reorg-safe EVM indexer (Go)"

on:
  push:
    paths:
      - "projects/11-go-reorg-safe-indexer/**"
      - ".github/workflows/11-go-reorg-safe-indexer.yml"
  pull_request:
    paths:
      - "projects/11-go-reorg-safe-indexer/**"
      - ".github/workflows/11-go-reorg-safe-indexer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/11-go-reorg-safe-indexer
    shell: bash

env:
  FOUNDRY_VERSION: v1.8.3
  UV_VERSION: "0.12.20"
  SLITHER_VERSION: "0.11.6"
  CRYTIC_COMPILE_VERSION: "0.4.2"
  # The race detector instruments with checkptr by default; modernc.org/sqlite's transpiled C
  # does pointer arithmetic checkptr rejects, so it is disabled. Race detection stays on.
  RACE_FLAGS: -race -gcflags=all=-d=checkptr=0
  # Logs and coverage data are kept as artifacts of every run, so the totals the README quotes
  # (property, fault and anvil runs, coverage) can be traced to a CI run.
  EVIDENCE_RETENTION_DAYS: 30

jobs:
  contracts:
    name: Fixture contracts (Foundry, Slither)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/11-go-reorg-safe-indexer/contracts
        shell: bash
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies (Soldeer)
        run: forge soldeer install

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Lint
        run: forge lint

      - name: Test (unit and fuzz; fixed seed in the ci profile)
        run: forge test -vv

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Slither
        run: >-
          uvx --python 3.12 --from "slither-analyzer==${SLITHER_VERSION}"
          --with "crytic-compile==${CRYTIC_COMPILE_VERSION}"
          slither . --config-file slither.config.json

  go:
    name: Go (bindings, modules, vet, unit/property tests with coverage, race, fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: projects/11-go-reorg-safe-indexer/go.mod
          cache-dependency-path: projects/11-go-reorg-safe-indexer/go.sum

      - name: Build contracts (inputs of go generate)
        working-directory: projects/11-go-reorg-safe-indexer/contracts
        run: |
          forge soldeer install
          forge build

      - name: Bindings are up to date (abigen v2 via go tool)
        run: |
          go generate ./...
          git diff --exit-code -- internal/bindings
          test -z "$(git status --porcelain -- internal/bindings)" || { git status --porcelain -- internal/bindings; exit 1; }

      - name: Module hygiene (go.mod and go.sum tidy, module cache verified)
        run: |
          go mod tidy -diff
          go mod verify

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet (every build tag)
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go vet -tags integration ./...
          CGO_ENABLED=0 go vet -tags postgres ./...

      - name: Unit, property, fault-injection and API contract tests (with coverage)
        run: COVERAGE_DIR=covdata bash script/coverage.sh unit 2>&1 | tee go-test.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 11-covdata-unit
          path: projects/11-go-reorg-safe-indexer/covdata/unit
          if-no-files-found: error

      - name: Deep property run (400 random scenarios, 20 under concurrent RPC faults)
        run: |
          INDEXER_PROP_SEEDS=400 INDEXER_FAULT_SEEDS=20 CGO_ENABLED=0 go test -count=1 -v -timeout 20m \
            -run 'TestIncrementalEqualsReindex|TestConcurrentFaultyNode' ./internal/indexer/ > property.log 2>&1 \
            || { tail -100 property.log; exit 1; }
          grep -E 'TOTAL|^(ok|FAIL|---)' property.log | grep -vE '^\s+--- PASS'

      - name: Race detector (internal packages, -short)
        run: CGO_ENABLED=1 go test $RACE_FLAGS -short -count=1 -timeout 30m ./internal/... 2>&1 | tee race.log | grep -E "^(--- FAIL|ok|FAIL|PASS)|DATA RACE"

      - name: Fuzz (60 s per target)
        run: |
          CGO_ENABLED=0 go test ./internal/reorg -run '^$' -fuzz='^FuzzReorgStateMachine$' -fuzztime=60s 2>&1 | tee fuzz-reorg.log
          CGO_ENABLED=0 go test ./internal/decode -run '^$' -fuzz='^FuzzDecodeLog$' -fuzztime=60s 2>&1 | tee fuzz-decode.log

      - name: Keep the logs (test totals, fuzz executions)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 11-go-logs
          path: projects/11-go-reorg-safe-indexer/*.log
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Keep fuzz crashers of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 11-go-fuzz-crashers
          path: projects/11-go-reorg-safe-indexer/**/testdata/fuzz/**
          if-no-files-found: ignore

  integration:
    name: Integration (anvil, reorgs, crashes, RPC faults), race
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: projects/11-go-reorg-safe-indexer/go.mod
          cache-dependency-path: projects/11-go-reorg-safe-indexer/go.sum

      - name: Integration tests (with coverage; 6 differential rounds)
        run: |
          INDEXER_IT_ROUNDS=6 COVERAGE_DIR=covdata bash script/coverage.sh integration > integration.log 2>&1 \
            || { grep -vE '^\{' integration.log | tail -150; exit 1; }
          grep -E 'TOTAL|^\s*--- |^(ok|FAIL|PASS)' integration.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 11-covdata-integration
          path: projects/11-go-reorg-safe-indexer/covdata/integration
          if-no-files-found: error

      # The in-process code under the race detector, and indexer subprocesses built with -race
      # (INDEXER_IT_RACE=1): a race report in a child process fails the test that started it.
      - name: Integration under the race detector
        run: INDEXER_IT_RACE=1 CGO_ENABLED=1 go test $RACE_FLAGS -count=1 -tags integration -timeout 30m -v ./integration/... 2>&1 | tee integration-race.log | grep -E "^(--- |ok|FAIL|PASS)|^\s+--- |DATA RACE|TOTAL"

      - name: Local demo (end-to-end smoke test of script/demo.sh)
        run: bash script/demo.sh 2>&1 | tee demo.log

      - name: Keep the logs (anvil totals, race run, demo)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 11-integration-logs
          path: projects/11-go-reorg-safe-indexer/*.log
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: warn

  postgres:
    name: PostgreSQL adapter (conformance suite, cross-backend differential, race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indexer
        # Container port only: the runner maps it to a free host port (read below), so nothing
        # depends on 5432 being available.
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: projects/11-go-reorg-safe-indexer/go.mod
          cache-dependency-path: projects/11-go-reorg-safe-indexer/go.sum

      # The `job` context (the mapped port) is only available at step level.
      - name: PostgreSQL tests (with coverage)
        env:
          INDEXER_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/indexer?sslmode=disable
        run: COVERAGE_DIR=covdata bash script/coverage.sh postgres 2>&1 | tee postgres.log | grep -E "^(--- |ok|FAIL|PASS)|^\s+--- |postgres_test.go"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 11-covdata-postgres
          path: projects/11-go-reorg-safe-indexer/covdata/postgres
          if-no-files-found: error

      - name: PostgreSQL tests under the race detector
        env:
          INDEXER_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/indexer?sslmode=disable
        run: CGO_ENABLED=1 go test $RACE_FLAGS -count=1 -tags postgres ./internal/store/postgres/... 2>&1 | tee postgres-race.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 11-postgres-logs
          path: projects/11-go-reorg-safe-indexer/*.log
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: warn

  coverage:
    name: Go coverage (unit + integration + PostgreSQL, minimum 90 %)
    needs: [go, integration, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: projects/11-go-reorg-safe-indexer/go.mod
          cache-dependency-path: projects/11-go-reorg-safe-indexer/go.sum

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: 11-covdata-unit
          path: projects/11-go-reorg-safe-indexer/covdata/unit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: 11-covdata-integration
          path: projects/11-go-reorg-safe-indexer/covdata/integration

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: 11-covdata-postgres
          path: projects/11-go-reorg-safe-indexer/covdata/postgres

      - name: Merge and enforce
        run: COVERAGE_DIR=covdata COVERAGE_MIN=90 bash script/coverage.sh merge 2>&1 | tee coverage.log

      - name: Keep the merged profile and the per-package summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 11-coverage
          path: |
            projects/11-go-reorg-safe-indexer/covdata/merged.out
            projects/11-go-reorg-safe-indexer/coverage.log
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: warn
