[package]
name = "e2e"
description = "End-to-end test: networked DKG, threshold-signed withdrawal settled on anvil, key rotation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Runs the anvil end-to-end test (requires `anvil` on PATH and `forge build` artifacts).
anvil = ["dep:alloy", "dep:custody-net", "dep:custody-protocol", "dep:frost-keccak", "dep:tokio", "dep:serde_json"]

[dependencies]
alloy = { workspace = true, optional = true, features = ["std", "reqwest", "essentials", "node-bindings", "sol-types", "json"] }
custody-net = { workspace = true, optional = true }
custody-protocol = { workspace = true, optional = true }
frost-keccak = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
